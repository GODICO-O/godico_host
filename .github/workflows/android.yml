name: GODICO Automated Android Build Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble-apk:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Ambil Kode dari Repositori
      uses: actions/checkout@v4

    - name: 2. Siapkan Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: 3. Kompilasi Biner Rust (Native)
      run: |
        cd rust_core
        cargo build --target aarch64-linux-android --release
        mkdir -p ../app/src/main/jniLibs/arm64-v8a/
        cp target/aarch64-linux-android/release/librust_core.so ../app/src/main/jniLibs/arm64-v8a/

    - name: 4. Siapkan Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 5. Rakit APK Final via Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: 6. Amankan File APK
      uses: actions/upload-artifact@v4
      with:
        name: GODICO-DevHub-APK
        path: app/build/outputs/apk/debug/app-debug.apk
