name: GODICO Automated Android Build Engine

on:
  push:
    branches: [ main ]

jobs:
  compile-and-assemble:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Kode dari Repositori
      uses: actions/checkout@v3

    - name: 2. Siapkan Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Pasang Compiler Rust & Target Android
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: 4. Konfigurasi Android NDK Environment
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true

    - name: 5. Eksekusi Kompilasi Silang Rust (Melahirkan .so)
      run: |
        cd rust_core
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=aarch64-linux-android23-clang
        cargo build --target aarch64-linux-android --release
        
        # Jembatan pemindahan biner otomatis di dalam server cloud
        mkdir -p ../app/src/main/jniLibs/arm64-v8a/
        cp target/aarch64-linux-android/release/librust_core.so ../app/src/main/jniLibs/arm64-v8a/

    # Catatan: Langkah pembungkusan Gradle APK akan otomatis aktif begitu 
    # file build.gradle utama dan source code Java lu gabungkan nanti!
