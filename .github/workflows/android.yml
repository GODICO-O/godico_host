name: GODICO Automated Android Build Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  compile-and-assemble:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Ambil Kode dari Repositori
      uses: actions/checkout@v4 # <-- MUTAKHIRKAN KE V4!

    - name: 2. Siapkan Java JDK 17
      uses: actions/setup-java@v4 # <-- MUTAKHIRKAN KE V4!
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 3. Pasang Compiler Rust & Target Android
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: 4. Konfigurasi Android NDK Environment
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true

    - name: 5. Eksekusi Kompilasi Silang Rust (Melahirkan .so)
      run: |
        cd rust_core
        export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android23-clang"
        cargo build --target aarch64-linux-android --release
        mkdir -p ../app/src/main/jniLibs/arm64-v8a/
        cp target/aarch64-linux-android/release/librust_core.so ../app/src/main/jniLibs/arm64-v8a/

    - name: 6. Rakit APK Final via Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --rerun-tasks

    - name: 7. Amankan File APK ke GitHub Artifacts
      uses: actions/upload-artifact@v4 # <-- INTEGRASI LEGAL KE V4!
      with:
        name: GODICO-DevHub-APK
        path: app/build/outputs/apk/debug/app-debug.apk
