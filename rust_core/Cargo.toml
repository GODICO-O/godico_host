[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
android-activity = { version = "0.5.2", features = ["game-activity"] }
log = "0.4"
android_logger = "0.13"
pixels = "0.13"
winit = "0.29"
ndk-sys = "0.5" # Untuk memastikan binding sistem stabil
jni = "0.21"

[profile.release]
opt-level = 'z'       # Optimasi ukuran (Size)
lto = true            # Link Time Optimization (Hapus kode mati)
codegen-units = 1     # Kompilasi lebih rapat
panic = 'abort'       # Buang fitur stack unwinding yang berat
strip = true          # BUANG SYMBOL DEBUG (Ini yang paling pengaruh ke ukuran!)
