[package]
name = "rust_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
ndk-sys = "0.5.0"
jni-sys = "0.3.0" # SUDAH DIREVISI PAKAI TANDA STRIP (LULUS SENSOR)
log = "0.4"
android_logger = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
