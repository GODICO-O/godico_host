plugins {
    id 'com.android.application'
}

android {
    namespace 'com.godico.devhub'
    compileSdk 33

    defaultConfig {
        applicationId "com.godico.devhub"
        minSdk 23
        targetSdk 33
        
        // Mengambil nomor build dari sistem luar (GitHub) jika ada, jika tidak default ke 1
        versionCode System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "1")
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
